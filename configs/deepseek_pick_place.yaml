# Real DeepSeek API demo. Set DEEPSEEK_API_KEY in your environment (or .env).
#   export DEEPSEEK_API_KEY=sk-...
#   python -m harness.cli configs/deepseek_pick_place.yaml
seed: 0

llm:
  provider: deepseek
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  temperature: 0.2
  max_tokens: 1024
  timeout: 60

env:
  name: toy_tabletop
  task: pick_and_place
  seed: 0
  max_episode_steps: 100
  params:
    obj_pos: [0.5, 0.5]
    goal_pos: [0.85, 0.85]

agent:
  name: llm_controller
  mode: json
  max_steps: 40
  use_vision: false

eval:
  episodes: 3
  log_dir: logs
  save_trajectories: true
  verbose: true
