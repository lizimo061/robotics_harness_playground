[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-harness"
version = "0.1.0"
description = "Modular harness for controlling simulated robots (MuJoCo / Genesis / Gymnasium) with LLMs (DeepSeek, Kimi, Claude, OpenAI)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Robotics Harness" }]
dependencies = [
  "numpy>=1.24",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pillow>=10.0",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.0", "gymnasium>=0.29", "gymnasium-robotics>=1.2"]
genesis = ["genesis-world"]
robosuite = ["robosuite>=1.4", "torch"]
dev = ["pytest>=8.0"]

[project.scripts]
robotics-harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
